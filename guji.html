<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>古籍书架已并入典籍 · 知否知否</title>
<meta name="description" content="“古籍书架”已并入“典籍”板块，页面会自动跳转到典籍书架。">
<meta http-equiv="refresh" content="3;url=dianji.html">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
  body { margin: 0; font-family: "Noto Serif SC", "Songti SC", serif; background: #f6f0e4; color: #2a2016; }
  .box { max-width: 560px; margin: 18vh auto 0; padding: 0 20px; text-align: center; line-height: 1.9; }
  .box a { color: #8f5227; }
</style>
</head>
<body>
<div class="box">
  <p>“古籍书架”已经并入新的“典籍”板块。</p>
  <p>正在带你过去……如果没有自动跳转，请点 <a id="go" href="dianji.html">这里去典籍书架</a>。</p>
</div>
<script>
(function () {
  /* 旧地址 guji.html?id=书名 → 典籍里对应那本书的书页（直接展开“与神灵的联系”一节）；其他情况去典籍书架 */
  var MAP = { '山海经': 'shanhaijing', '楚辞': 'chuci', '淮南子': 'huainanzi', '列子': 'liezi', '诗经': 'shijing', '尚书': 'shangshu',
    '左传': 'zuozhuan', '国语': 'guoyu', '逸周书': 'yizhoushu', '史记': 'shiji', '论衡': 'lunheng', '博物志': 'bowuzhi',
    '搜神记': 'soushenji', '神异经': 'shenyijing', '穆天子传': 'mutianzizhuan', '列仙传': 'liexianzhuan' };
  var to = 'dianji.html';
  try {
    var id = new URLSearchParams(location.search).get('id');
    if (id && MAP[id]) to = 'dianji-book.html?id=' + MAP[id] + '#shen';
  } catch (e) { /* 忽略 */ }
  document.getElementById('go').href = to;
  location.replace(to);
})();
</script>
</body>
</html>
